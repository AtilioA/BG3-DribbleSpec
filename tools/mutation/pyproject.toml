[project]
name = "dribblespec-mutate"
version = "0.1.0"
description = "Mutation testing host for DribbleSpec (BG3SE) mods"
authors = [
    { name = "Atílio", email = "27153776+AtilioA@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lupa==2.8",
    "tree-sitter==0.25.2",
    "tree-sitter-lua==0.5.0",
]

[project.scripts]
dribblespec-mutate = "dribblespec_mutate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
